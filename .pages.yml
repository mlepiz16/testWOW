media: media

content:
  - name: status
    label: Estado operativo
    type: file
    path: data/status.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: estado
        label: Estado general
        type: select
        required: true
        options:
          values: [Abierto, Cerrado, Horario especial]
      - name: horario
        label: Horario de hoy
        type: select
        required: true
        options:
          values:
            - 10:00 a. m. – 7:00 p. m.
            - 11:00 a. m. – 7:00 p. m.
            - 2:00 p. m. – 8:00 p. m.
            - Consultar por WhatsApp
      - name: juegos
        label: Área de juegos
        type: select
        required: true
        options:
          values: [Disponible, Disponibilidad limitada, No disponible]
      - name: nova
        label: Salón Nova
        type: select
        required: true
        options:
          values:
            - Disponible
            - Reservado esta mañana
            - Reservado esta tarde
            - Reservado todo el día
            - No disponible
      - name: segundo
        label: Segundo salón
        type: select
        required: true
        options:
          values:
            - Disponible
            - Reservado esta mañana
            - Reservado esta tarde
            - Reservado todo el día
            - No disponible
      - name: aviso
        label: Aviso operativo
        type: select
        required: true
        options:
          values:
            - Sin avisos especiales
            - Hay un evento privado esta mañana
            - Hay un evento privado esta tarde
            - Hay un evento privado esta noche
            - Mantenimiento parcial
            - Horario especial
      - name: promocion
        label: Promoción
        type: select
        required: true
        options:
          values:
            - Sin promoción vigente
            - 2 horas + snack por ₡10.000
            - 2x1 miércoles
            - Consultar promociones por WhatsApp
      - name: nota
        label: Nota especial
        type: string
        required: false
        description: Único campo libre; usar solo cuando una opción predefinida no sea suficiente.
        options:
          maxlength: 140
