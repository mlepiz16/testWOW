media: media

content:
  - name: status
    label: Estado operativo
    type: file
    path: data/status.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: promocion
        label: Promoción vigente
        type: select
        required: true
        options:
          values:
            - Sin promoción vigente
            - 2 horas + snack por ₡10.000
            - 2x1 miércoles
            - Consultar promociones por WhatsApp

      - name: nota
        label: Nota especial
        type: string
        required: false
        description: Texto opcional visible para clientes.
        options:
          maxlength: 140

      - name: override_general
        label: Excepción general
        type: select
        required: true
        description: Dejá Automático salvo cierre o apertura excepcional.
        options:
          values:
            - Automático
            - Forzar abierto
            - Forzar cerrado

      - name: override_juegos
        label: Excepción · Área de juegos
        type: select
        required: true
        options:
          values:
            - Automático
            - Forzar disponible
            - Forzar no disponible

      - name: override_nova
        label: Excepción · Salón Nova
        type: select
        required: true
        options:
          values:
            - Automático
            - Forzar disponible
            - Forzar no disponible

      - name: override_segundo
        label: Excepción · Segundo salón
        type: select
        required: true
        options:
          values:
            - Automático
            - Forzar disponible
            - Forzar no disponible

      - name: reservas
        label: Reservaciones programadas
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fecha} · {espacio} · {inicio}–{fin}"
        fields:
          - name: fecha
            label: Fecha
            type: string
            required: true
            description: Formato AAAA-MM-DD.
            pattern:
              regex: "^\\d{4}-\\d{2}-\\d{2}$"
              message: "Usá formato AAAA-MM-DD"
          - name: espacio
            label: Espacio reservado
            type: select
            required: true
            options:
              values:
                - Salón Nova
                - Segundo salón
          - name: inicio
            label: Hora de inicio
            type: string
            required: true
            description: Formato 24 horas HH:MM.
            pattern:
              regex: "^([01]\\d|2[0-3]):[0-5]\\d$"
              message: "Usá formato HH:MM, por ejemplo 15:00"
          - name: fin
            label: Hora de finalización
            type: string
            required: true
            description: Formato 24 horas HH:MM.
            pattern:
              regex: "^([01]\\d|2[0-3]):[0-5]\\d$"
              message: "Usá formato HH:MM, por ejemplo 18:00"

      - name: eventos_publicos
        label: Próximos eventos públicos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fecha} · {titulo} · {inicio}–{fin}"
        fields:
          - name: fecha
            label: Fecha
            type: string
            required: true
            description: Formato AAAA-MM-DD.
            pattern:
              regex: "^\\d{4}-\\d{2}-\\d{2}$"
              message: "Usá formato AAAA-MM-DD"
          - name: titulo
            label: Nombre del evento
            type: string
            required: true
            options:
              maxlength: 80
          - name: inicio
            label: Hora de inicio
            type: string
            required: true
            description: Formato 24 horas HH:MM.
            pattern:
              regex: "^([01]\\d|2[0-3]):[0-5]\\d$"
              message: "Usá formato HH:MM, por ejemplo 15:00"
          - name: fin
            label: Hora de finalización
            type: string
            required: true
            description: Formato 24 horas HH:MM.
            pattern:
              regex: "^([01]\\d|2[0-3]):[0-5]\\d$"
              message: "Usá formato HH:MM, por ejemplo 17:00"
